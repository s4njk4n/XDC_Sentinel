name: XDC Sentinel Monitoring

on:
  schedule:
    - cron: '7 * * * *' # Every hour at :07 (runs set for :00 are the ones GitHub delays most)
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write   # only used by the keep-alive step below

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Install dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y netcat-openbsd curl

      # Create nodes.csv from GitHub Secret
      - name: Create nodes.csv
        env:
          NODES_CSV: ${{ secrets.NODES_CSV }}
        run: |
          echo "$NODES_CSV" > nodes.csv
          echo "nodes.csv created successfully"

      # Restore node_states.txt from cache (or initialize if missing)
      - name: Cache node_states.txt
        uses: actions/cache@v4
        with:
          path: node_states.txt
          key: node-states-${{ runner.os }}-${{ github.run_id }}  # Unique per run for saving
          restore-keys: node-states-${{ runner.os }}-  # Restore from any previous cache

      # Initialize if still missing after cache restore
      - name: Initialize node_states.txt
        run: |
          if [ ! -f "node_states.txt" ]; then
            touch node_states.txt
            echo "Initialized empty node_states.txt"
          fi

      # Run the sentinel script
      - name: Run XDC Sentinel
        env:
          NOTIFY_TZ: ${{ vars.NOTIFY_TZ }}
          DAILY_HOUR: ${{ vars.DAILY_HOUR }}
        run: |
          chmod +x sentinel.sh
          ./sentinel.sh

      # GitHub switches off scheduled workflows in public repos after 60 days without any repository
      # activity, which would silently stop your monitoring. Once every ~50 days this adds an empty
      # commit so the schedule stays on. It never touches your files or secrets.
      - name: Keep the schedule active
        if: always() && github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled monitoring active"
            git push
          else
            echo "Repository active within the last 50 days; nothing to do."
          fi
